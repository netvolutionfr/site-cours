<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <style>
      .card { fill: #F7F8FA; stroke: #172033; stroke-width: 3; }
      .cut  { fill: #172033; }
      .hole { fill: #F7F8FA; stroke: #3568D4; stroke-width: 4; }
      .bit  { font-family: 'JetBrains Mono','IBM Plex Mono',monospace; font-size: 28px; fill: #172033; }
      .lbl  { font-family: 'Inter','Source Sans 3',sans-serif; font-size: 20px; fill: #687386; }
    </style>
  </defs>

  <!-- corps de la carte, coin coupé (repère d'orientation Jacquard) -->
  <path class="card" d="M40,20 H820 a40,40 0 0 1 40,40 V300 a20,20 0 0 1 -20,20 H60 a20,20 0 0 1 -20,-20 V20 Z" />

  <!-- 8 positions : motif 0 1 0 0 1 1 0 1 = 77 en base 10 -->
  <g>
    <!-- position 1 : 0 -->
    <rect class="cut" x="90"  y="120" width="60" height="60" />
    <!-- position 2 : 1 -->
    <circle class="hole" cx="220" cy="150" r="30" />
    <!-- position 3 : 0 -->
    <rect class="cut" x="280" y="120" width="60" height="60" />
    <!-- position 4 : 0 -->
    <rect class="cut" x="380" y="120" width="60" height="60" />
    <!-- position 5 : 1 -->
    <circle class="hole" cx="510" cy="150" r="30" />
    <!-- position 6 : 1 -->
    <circle class="hole" cx="600" cy="150" r="30" />
    <!-- position 7 : 0 -->
    <rect class="cut" x="650" y="120" width="60" height="60" />
    <!-- position 8 : 1 -->
    <circle class="hole" cx="770" cy="150" r="30" />
  </g>

  <!-- lecture binaire sous la carte -->
  <text class="bit" x="105" y="250">0</text>
  <text class="bit" x="205" y="250">1</text>
  <text class="bit" x="295" y="250">0</text>
  <text class="bit" x="395" y="250">0</text>
  <text class="bit" x="495" y="250">1</text>
  <text class="bit" x="585" y="250">1</text>
  <text class="bit" x="665" y="250">0</text>
  <text class="bit" x="755" y="250">1</text>

  <text class="lbl" x="60" y="290">trou = 1 (bit lu)</text>
  <text class="lbl" x="60" y="316">pas de trou = 0</text>
</svg>
