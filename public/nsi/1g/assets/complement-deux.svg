<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <style>
      .neg { fill:#FDEDEC; stroke:#D95C59; stroke-width:3; }
      .pos { fill:#EAF4FB; stroke:#3568D4; stroke-width:3; }
      .line { stroke:#172033; stroke-width:4; fill:none; }
      .tick { stroke:#172033; stroke-width:3; }
      .label { font-family:Inter,Arial,sans-serif; font-size:24px; fill:#172033; }
      .mono { font-family:'JetBrains Mono',monospace; font-size:30px; fill:#172033; }
      .small { font-family:Inter,Arial,sans-serif; font-size:20px; fill:#687386; }
    </style>
  </defs>
  <rect class="neg" x="55" y="70" width="410" height="125" rx="14"/>
  <rect class="pos" x="495" y="70" width="410" height="125" rx="14"/>
  <text class="label" x="80" y="110">bit de gauche = 1</text>
  <text class="mono" x="80" y="155">1xxxxxxx</text>
  <text class="label" x="255" y="155">de −128 à −1</text>
  <text class="label" x="520" y="110">bit de gauche = 0</text>
  <text class="mono" x="520" y="155">0xxxxxxx</text>
  <text class="label" x="695" y="155">de 0 à 127</text>
  <path class="line" d="M85 300 H875"/>
  <path class="tick" d="M90 280 V320 M475 280 V320 M870 280 V320"/>
  <text class="label" x="58" y="355">−128</text>
  <text class="label" x="462" y="355">0</text>
  <text class="label" x="850" y="355">127</text>
  <text class="small" x="265" y="405">256 écritures possibles, partagées entre négatifs et positifs</text>
</svg>
